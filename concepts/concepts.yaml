# MatSek concept registry — the shared vocabulary every teaches/requires/
# section_concepts entry resolves against (spec/bundles.md, "The concept
# registry"). The requires edges form the prerequisite DAG the retrieval
# ladder walks, so an edge means "a tutor would teach this first", not
# merely "this is related" — keep edges minimal and transitive-free where
# a chain already implies them.

# --- Foundations ---

- id: sets
  title: Sets
  description: Membership, subsets, unions, intersections, complements and products.
  requires: []
  msc: "03E75"

- id: functions
  title: Functions
  description: Maps between sets; domain, codomain, image, injectivity, surjectivity, composition and inverses.
  requires: [sets]

- id: cardinality
  title: Cardinality
  description: Comparing sizes of sets via bijections; countability and Cantor's diagonal argument.
  requires: [functions]
  msc: "03E10"

- id: induction
  title: Mathematical induction
  description: Proving statements over the naturals from a base case and an inductive step.
  requires: [sets]

- id: strong-induction
  title: Strong induction
  description: Induction assuming the claim for all smaller cases, and strengthening a hypothesis to make the step go through.
  requires: [induction]

- id: pigeonhole
  title: Pigeonhole principle
  description: Placing more objects than boxes forces a collision; counting arguments built on that observation.
  requires: [functions]
  msc: "05A05"

- id: modular-arithmetic
  title: Modular arithmetic
  description: Congruences, residue classes and arithmetic modulo n; divisibility through the lens of remainders.
  requires: [induction]
  msc: "11A07"

- id: functional-equations
  title: Functional equations
  description: Determining functions from identities they satisfy; substitution, symmetry and Cauchy-type equations.
  requires: [functions, induction]
  msc: "39B22"

# --- Order theory and category theory ---

- id: partial-orders
  title: Partial orders
  description: Reflexive, antisymmetric, transitive relations; chains, bounds, suprema and infima.
  requires: [sets, functions]
  msc: "06A06"

- id: closure-operators
  title: Closure operators
  description: Extensive, monotone, idempotent maps on a poset and their closed elements.
  requires: [partial-orders]
  msc: "06A15"

- id: galois-connections
  title: Galois connections
  description: Adjoint pairs of monotone maps between posets; how they exchange meets and joins and induce closure operators.
  requires: [partial-orders, closure-operators]
  msc: "06A15"

- id: categories-functors
  title: Categories and functors
  description: Objects, morphisms and composition; functors as structure-preserving maps between categories.
  requires: [sets, functions]
  msc: "18A05"

- id: limits-colimits
  title: Limits and colimits
  description: Universal cones and cocones - products, coproducts, equalizers, pullbacks - as one construction.
  requires: [categories-functors]
  msc: "18A30"

- id: adjoint-functors
  title: Adjoint functors
  description: Functor pairs related by a natural hom-set bijection; free constructions as left adjoints and their preservation of colimits.
  requires: [categories-functors, limits-colimits, galois-connections]
  msc: "18A40"

# --- Group theory ---

- id: groups
  title: Groups
  description: Sets with an associative operation, identity and inverses; order of a group and of an element.
  requires: [sets, functions]
  msc: "20A05"

- id: subgroups
  title: Subgroups
  description: Subsets closed under the group operation and inverses; subgroup criteria and generated subgroups.
  requires: [groups]

- id: cyclic-groups
  title: Cyclic groups
  description: Groups generated by a single element; their subgroups and the structure of Z and Z/nZ.
  requires: [subgroups, modular-arithmetic]
  msc: "20K01"

- id: permutation-groups
  title: Permutation groups
  description: Symmetric and alternating groups; cycle notation, parity and composition of permutations.
  requires: [groups]
  msc: "20B05"

- id: cosets
  title: Cosets
  description: Left and right translates of a subgroup and the partition of the group they form.
  requires: [subgroups]

- id: index
  title: Index of a subgroup
  description: The number of cosets of a subgroup; counting cosets and multiplicativity in towers.
  requires: [cosets]

- id: lagrange
  title: Lagrange's theorem
  description: The order of a subgroup divides the order of a finite group, with element orders as a corollary.
  requires: [cosets, index]
  msc: "20D60"

- id: normal-subgroups
  title: Normal subgroups
  description: Subgroups invariant under conjugation, exactly those whose left and right cosets agree.
  requires: [cosets]

- id: quotient-groups
  title: Quotient groups
  description: The group structure on cosets of a normal subgroup; coset arithmetic and orders of elements in G/N.
  requires: [normal-subgroups]

- id: group-homomorphisms
  title: Group homomorphisms
  description: Operation-preserving maps between groups; images, preimages and isomorphisms.
  requires: [groups]

- id: kernels
  title: Kernels
  description: The preimage of the identity under a homomorphism; kernels as normal subgroups and injectivity via trivial kernel.
  requires: [group-homomorphisms, normal-subgroups]

- id: first-isomorphism-theorem
  title: First isomorphism theorem
  description: Every homomorphism factors as a quotient by its kernel followed by an isomorphism onto its image.
  requires: [kernels, quotient-groups]

- id: group-actions
  title: Group actions
  description: Homomorphisms from a group into the symmetries of a set; actions as external multiplication and their equivalent axioms.
  requires: [groups, permutation-groups]
  msc: "20B99"

- id: orbits-stabilizers
  title: Orbits and stabilizers
  description: The partition of a set into orbits under an action, and the stabilizer subgroup of a point.
  requires: [group-actions]

- id: orbit-stabilizer-theorem
  title: Orbit-stabilizer theorem
  description: The bijection between an orbit and the cosets of a stabilizer, giving |orbit| times |stabilizer| equals |G|.
  requires: [orbits-stabilizers, lagrange]

- id: action-on-cosets
  title: Action on cosets
  description: Left multiplication of G on G/H, the induced map into Sym(G/H), its kernel as the normal core, and index-based normality arguments.
  requires: [group-actions, index, kernels]

- id: conjugation
  title: Conjugation
  description: The action of a group on itself by conjugation; conjugacy classes, centralizers and the center.
  requires: [group-actions, normal-subgroups]

- id: class-equation
  title: Class equation
  description: Decomposing a finite group into conjugacy classes and counting via centralizer indices.
  requires: [conjugation, orbit-stabilizer-theorem]

- id: p-groups
  title: p-groups
  description: Groups of prime-power order; nontrivial centers via the class equation and consequences for their structure.
  requires: [lagrange, class-equation]
  msc: "20D15"

- id: cauchy-theorem
  title: Cauchy's theorem
  description: A finite group whose order is divisible by a prime p contains an element of order p.
  requires: [group-actions, lagrange, modular-arithmetic]
  msc: "20D60"

- id: sylow-theorems
  title: Sylow theorems
  description: Existence, conjugacy and counting of maximal p-subgroups of a finite group.
  requires: [p-groups, class-equation, group-actions, cauchy-theorem]
  msc: "20D20"

# --- Analysis ---

- id: sequences
  title: Sequences
  description: Functions from the naturals into the reals; monotonicity, boundedness and subsequences.
  requires: [functions]
  msc: "40A05"

- id: sequence-limits
  title: Limits of sequences
  description: Epsilon-N convergence; uniqueness, arithmetic of limits and convergence of monotone bounded sequences.
  requires: [sequences]
  msc: "40A05"

- id: series-convergence
  title: Convergence of series
  description: Series as limits of partial sums; geometric and harmonic benchmarks, absolute versus conditional convergence.
  requires: [sequence-limits]
  msc: "40A05"

- id: comparison-test
  title: Comparison tests
  description: Direct and limit comparison of a series against a known benchmark.
  requires: [series-convergence]

- id: ratio-root-tests
  title: Ratio and root tests
  description: Convergence from the asymptotic growth rate of terms, via comparison with geometric series.
  requires: [comparison-test]

- id: cauchy-condensation
  title: Cauchy condensation
  description: Trading a monotone series for its dyadically condensed counterpart, deciding borderline cases like p-series and log scales.
  requires: [comparison-test]

- id: limits-of-functions
  title: Limits of functions
  description: Epsilon-delta and sequential limits of real functions at a point; one-sided limits and limit arithmetic.
  requires: [sequence-limits]
  msc: "26A03"

- id: epsilon-delta-continuity
  title: Epsilon-delta continuity
  description: Continuity at a point and on a set via epsilon-delta; equivalence with the sequential formulation.
  requires: [limits-of-functions]
  msc: "26A15"

- id: uniform-continuity
  title: Uniform continuity
  description: A single delta serving every point; the gap between continuity and uniform continuity on unbounded or open domains.
  requires: [epsilon-delta-continuity]
  msc: "26A15"

- id: compactness
  title: Compactness
  description: Sequential compactness and open covers on the real line and in metric spaces; extreme values and uniform continuity as payoffs.
  requires: [sequence-limits, uniform-continuity]
  msc: "54D30"

- id: connectedness
  title: Connectedness
  description: Sets that cannot be split by disjoint open sets; intervals, the intermediate value theorem and invariance under continuous maps.
  requires: [epsilon-delta-continuity]
  msc: "54D05"

- id: pointwise-convergence
  title: Pointwise convergence
  description: Convergence of a sequence of functions at each point separately, and the properties it fails to preserve.
  requires: [sequence-limits]

- id: uniform-convergence
  title: Uniform convergence
  description: Convergence in the supremum sense; preservation of continuity and the legitimacy of exchanging limits.
  requires: [pointwise-convergence, epsilon-delta-continuity]

# --- Linear algebra ---

- id: vector-spaces
  title: Vector spaces
  description: Axioms of vector spaces; subspaces, spanning sets, linear independence, bases and dimension.
  requires: [sets, functions]
  msc: "15A03"

- id: linear-maps
  title: Linear maps
  description: Structure-preserving maps between vector spaces; kernels, images and matrix representations.
  requires: [vector-spaces]
  msc: "15A04"

- id: rank-nullity
  title: Rank-nullity theorem
  description: Dimension of the domain as rank plus nullity; injectivity, surjectivity and solvability of linear systems as corollaries.
  requires: [linear-maps]
  msc: "15A03"

- id: eigenvalues-eigenvectors
  title: Eigenvalues and eigenvectors
  description: Invariant directions of a linear map; characteristic polynomial and eigenspaces.
  requires: [linear-maps]
  msc: "15A18"

- id: diagonalization
  title: Diagonalization
  description: When a basis of eigenvectors exists; criteria via eigenspace dimensions and multiplicities.
  requires: [eigenvalues-eigenvectors]
  msc: "15A20"

- id: inner-product-spaces
  title: Inner product spaces
  description: Inner products, norms and orthogonality; orthonormal bases and orthogonal projection.
  requires: [vector-spaces]
  msc: "15A63"

- id: cauchy-schwarz
  title: Cauchy-Schwarz inequality
  description: Bounding an inner product by the product of norms, with the equality case; instances in R^n, integrals and probability.
  requires: [inner-product-spaces]
  msc: "15A63"

- id: spectral-theorem
  title: Spectral theorem
  description: Orthogonal diagonalizability of symmetric (self-adjoint) operators on real inner product spaces.
  requires: [diagonalization, inner-product-spaces]
  msc: "15A18"

# --- Probability ---

- id: probability-basics
  title: Probability basics
  description: Sample spaces, events and probability measures on finite or countable spaces; conditional probability and independence.
  requires: [sets, functions]
  msc: "60A05"

- id: random-variables
  title: Random variables
  description: Functions from a sample space into the reals; distributions of discrete random variables.
  requires: [probability-basics]
  msc: "60E05"

- id: expectation
  title: Expectation
  description: The mean of a random variable as a probability-weighted sum; basic properties and variance.
  requires: [random-variables, series-convergence]
  msc: "60E05"

- id: linearity-of-expectation
  title: Linearity of expectation
  description: Additivity of expectation without independence; the indicator-variable method for counting in expectation.
  requires: [expectation]

# --- Information theory ---

- id: entropy
  title: Entropy
  description: Shannon entropy as expected surprise of a discrete distribution; its basic properties and interpretation as average information.
  requires: [expectation]
  msc: "94A17"
